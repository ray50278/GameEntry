<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07020f">
  <title>GAME CENTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <div class="marquee-lights" aria-hidden="true"></div>
      <h1 class="marquee-title" id="title">GAME CENTER</h1>
      <p class="marquee-sub" id="subtitle">SELECT YOUR GAME</p>
    </header>

    <main class="screen">
      <div class="screen-glass">
        <div class="hud">
          <span class="hud-item">1UP <b id="count">00</b></span>
          <span class="hud-item blink">INSERT COIN</span>
          <span class="hud-item">CREDIT <b>99</b></span>
        </div>

        <ul class="game-grid" id="gameGrid" role="listbox" aria-label="遊戲列表"></ul>

        <div class="status" id="status" hidden></div>
      </div>
      <div class="scanlines" aria-hidden="true"></div>
    </main>

    <footer class="control-panel" aria-hidden="true">
      <div class="joystick"><span class="stick"></span></div>
      <div class="press-start blink">PRESS START</div>
      <div class="buttons">
        <span class="btn btn-a"></span>
        <span class="btn btn-b"></span>
        <span class="btn btn-c"></span>
      </div>
    </footer>
  </div>

  <script src="./main.js"></script>
</body>
</html>
